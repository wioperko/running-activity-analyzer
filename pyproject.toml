[project]
name = "running-activity-analyzer"
version = "0.1.0"
description = "A Python application for reading, validating, and analyzing sports activity data from JSON files."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["email-validator>=2.3.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=running_activity_analyzer --cov-fail-under=90"

[tool.mypy]
strict = true


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
